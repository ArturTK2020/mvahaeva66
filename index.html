<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>Miner's Quest — Этап 7 (Мультиплеер)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <div id="joystick">
    <div id="joystickKnob"></div>
  </div>
  <div id="btnAction" class="mobileBtn">⛏</div>
  <div id="btnAttack" class="mobileBtn">⚔️</div>
  <div id="btnEat" class="mobileBtn">🍗</div>
  <div id="btnShop" class="mobileBtn">🛒</div>
  <div id="btnInv" class="mobileBtn">🎒</div>
  <div id="btnMenu" class="mobileBtn">☰</div>
</div>

<!-- Скрытие мобильных элементов на ПК -->
<script>
(function() {
  const ua = navigator.userAgent;
  const isRealMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  if (!isRealMobile) {
    ['joystick','btnAction','btnAttack','btnEat','btnShop','btnInv','btnMenu'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.style.display = 'none';
        el.style.visibility = 'hidden';
        el.style.pointerEvents = 'none';
      }
    });
  }
})();
</script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<!-- Настройки Firebase -->
<script>
  window.FIREBASE_CONFIG = {
    databaseURL: "https://miners-quest-xxxxx-default-rtdb.firebaseio.com/"
    // ↑ ЗАМЕНИ на свой URL из шага 1.2
  };
</script>

<script src="script.js"></script>

</body>
</html>
