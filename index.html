<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>Miner's Quest — Этапы 1-4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <!-- Мобильные элементы управления -->
  <div id="joystick">
    <div id="joystickKnob"></div>
  </div>
  <div id="btnAction" class="mobileBtn">⛏</div>
  <div id="btnAttack" class="mobileBtn">⚔️</div>
  <div id="btnEat" class="mobileBtn">🍗</div>
  <div id="btnShop" class="mobileBtn">🛒</div>
  <div id="btnInv" class="mobileBtn">🎒</div>
  <div id="btnMenu" class="mobileBtn">☰</div>
</div>

<!-- Предохранитель: на ПК скрываем все сенсорные элементы -->
<script>
(function() {
  const ua = navigator.userAgent;
  const isRealMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  if (!isRealMobile) {
    ['joystick','btnAction','btnAttack','btnEat','btnShop','btnInv','btnMenu'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.style.display = 'none';
        el.style.visibility = 'hidden';
        el.style.pointerEvents = 'none';
      }
    });
  }
})();
</script>

<!-- Основной скрипт игры -->
<script src="script.js"></script>

</body>
</html>
